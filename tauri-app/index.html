<!DOCTYPE html>
<html lang="en" style="background-color: #07090e; margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>StreamShield</title>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="background:#07090e;color:#00f0ff;font-family:sans-serif;padding:24px;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;"><h2 style="color:#ff007f;">StreamShield Startup Error</h2><pre style="color:#94a3b8;font-size:12px;white-space:pre-wrap;margin-top:12px;max-width:420px;text-align:left;background:#0d121c;padding:12px;border-radius:6px;border:1px solid rgba(0,240,255,0.2);">' + (e.error ? (e.error.stack || e.error.message) : e.message) + '</pre><button onclick="window.location.reload()" style="margin-top:16px;padding:8px 16px;background:#00f0ff;color:#07090e;border:none;border-radius:6px;font-weight:bold;cursor:pointer;">Reload</button></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled Promise:', e.reason);
      });
    </script>
  </head>
  <body style="background-color: #07090e; color: #f8fafc; margin: 0; padding: 0; overflow: hidden; user-select: none; width: 100%; height: 100%;">
    <div id="root" style="background-color: #07090e; width: 100%; height: 100%;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
