[package]
name = "streamshield"
version = "0.1.0"
edition = "2021"

[lib]
name = "streamshield_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
  "winuser",
  "processthreadsapi",
  "memoryapi",
  "libloaderapi",
  "handleapi",
  "tlhelp32",
  "psapi",
  "shellapi",
  "errhandlingapi",
  "winnt",
] }

[profile.release]
opt-level = "s"
strip = true